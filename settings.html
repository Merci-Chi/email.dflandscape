<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#0f2617">
  <title>Settings | Desert Forest Landscape Email</title>
  <link rel="stylesheet" href="styles.css?v=account-pages-1">
</head>
<body class="account-page">
  <header class="topbar">
    <div class="topbar-left">
      <img class="topbar-main-logo" src="https://raw.githubusercontent.com/Merci-Chi/DFLandscape/main/images/logo.png" alt="Desert Forest Landscape logo">
      <a class="topbar-brand" href="https://dflandscape.com" aria-label="Desert Forest Landscape home">
        <div class="topbar-brand-images">
          <img class="topbar-brand-text" src="https://raw.githubusercontent.com/Merci-Chi/DFLandscape/main/images/text.png" alt="Desert Forest Landscape">
          <div class="topbar-slogan-row">
            <img class="topbar-brand-slogan" src="https://raw.githubusercontent.com/Merci-Chi/DFLandscape/main/images/slogan.png" alt="Turning Over a New Leaf">
            <img class="topbar-brand-leaf" src="https://raw.githubusercontent.com/Merci-Chi/DFLandscape/main/images/leaf.png" alt="">
          </div>
        </div>
        <span class="topbar-email-label">Email</span>
      </a>
    </div>
    <div class="topbar-actions">
      <nav class="topbar-nav" aria-label="Account navigation">
        <a class="topbar-tab" href="mail.html">Mail</a>
        <a class="topbar-tab" href="manage-emails.html">Manage Emails</a>
        <a class="topbar-tab active" href="settings.html">Settings</a>
      </nav>
      <a class="signout" href="index.html">Sign out</a>
    </div>
  </header>

  <main class="account-page-main">
    <div class="account-page-head">
      <div class="eyebrow dark">Account</div>
      <h1>Settings</h1>
      <p>Update the profile and password for the signed-in account.</p>
    </div>

    <section class="account-card">
      <h2>Profile</h2>
      <p class="account-card-subtext">This information is tied to your company email login.</p>
      <form class="account-form" id="profileForm">
        <label>
          Email
          <input class="readonly-field" id="settingsEmail" type="email" readonly>
        </label>
        <label>
          Display name
          <input id="settingsDisplayName" type="text" maxlength="80" required>
        </label>
        <button type="submit">Save profile</button>
        <p class="account-message" id="profileMessage" aria-live="polite"></p>
      </form>
    </section>

    <section class="account-card">
      <h2>Change password</h2>
      <p class="account-card-subtext">Choose a new password with at least 8 characters.</p>
      <form class="account-form" id="passwordForm">
        <label>
          New password
          <input id="settingsPassword" type="password" autocomplete="new-password" minlength="8" required>
        </label>
        <label>
          Confirm new password
          <input id="settingsPasswordConfirm" type="password" autocomplete="new-password" minlength="8" required>
        </label>
        <button type="submit">Update password</button>
        <p class="account-message" id="passwordMessage" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <script type="module" src="account-pages.js?v=1"></script>
</body>
</html>
