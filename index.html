<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#0f2617">
  <title>Desert Forest Landscape Email</title>
  <link rel="stylesheet" href="styles.css?v=mobile-zoom-lock-1">
</head>
<body class="login-page">
  <main class="login-wrap">
    <section class="login-card">
      <div class="login-brand-header">
        <a class="login-header-brand" href="https://dflandscape.com" aria-label="Desert Forest Landscape home">
          <img class="login-main-logo" src="https://raw.githubusercontent.com/Merci-Chi/DFLandscape/main/images/logo.png" alt="Desert Forest Landscape logo">
          <div class="login-brand-images">
            <img class="brand-text" src="https://raw.githubusercontent.com/Merci-Chi/DFLandscape/main/images/text.png" alt="Desert Forest Landscape">
            <div class="brand-slogan-row">
              <img class="brand-slogan" src="https://raw.githubusercontent.com/Merci-Chi/DFLandscape/main/images/slogan.png" alt="Turning Over a New Leaf">
              <img class="brand-leaf" src="https://raw.githubusercontent.com/Merci-Chi/DFLandscape/main/images/leaf.png" alt="">
            </div>
          </div>
        </a>
      </div>

      <div class="login-card-body">
        <div class="eyebrow">Company Mail</div>
        <h1 id="authTitle">Email</h1>
        <p class="subtext" id="authSubtext">Sign in to your company mailbox.</p>

        <form id="loginForm" class="login-form">
          <label>
            Email
            <input id="email" type="email" autocomplete="username" placeholder="name@dflandscape.com" required>
          </label>

          <label>
            Password
            <div class="password-wrap">
              <input id="password" type="password" autocomplete="current-password" placeholder="Password" required>
              <button class="icon-btn password-toggle" type="button" data-target="password" aria-label="Show password" title="Show password"></button>
              <button class="icon-btn copy-password" type="button" data-target="password" aria-label="Copy password" title="Copy password"></button>
            </div>
          </label>

          <button class="primary-auth-btn" type="submit">Sign in</button>
          <button class="text-button" id="forgotPasswordBtn" type="button">Forgot password?</button>
          <p id="loginMessage" class="form-message" aria-live="polite"></p>
        </form>

        <form id="forgotForm" class="login-form hidden">
          <label>
            Email
            <input id="forgotEmail" type="email" autocomplete="email" placeholder="name@dflandscape.com" required>
          </label>
          <button class="primary-auth-btn" type="submit">Send reset link</button>
          <button class="text-button" id="backToLoginBtn" type="button">Back to sign in</button>
          <p id="forgotMessage" class="form-message" aria-live="polite"></p>
        </form>

        <form id="firstLoginForm" class="login-form hidden">
          <label>
            Display name
            <input id="displayName" type="text" autocomplete="name" placeholder="How your name should appear" maxlength="80" required>
          </label>

          <label>
            New password
            <div class="password-wrap">
              <input id="firstNewPassword" type="password" autocomplete="new-password" placeholder="New password" required>
              <button class="icon-btn password-toggle" type="button" data-target="firstNewPassword" aria-label="Show password" title="Show password"></button>
              <button class="icon-btn copy-password" type="button" data-target="firstNewPassword" aria-label="Copy password" title="Copy password"></button>
            </div>
          </label>

          <label>
            Confirm new password
            <div class="password-wrap">
              <input id="firstConfirmPassword" type="password" autocomplete="new-password" placeholder="Confirm new password" required>
              <button class="icon-btn password-toggle" type="button" data-target="firstConfirmPassword" aria-label="Show password" title="Show password"></button>
              <button class="icon-btn copy-password" type="button" data-target="firstConfirmPassword" aria-label="Copy password" title="Copy password"></button>
            </div>
          </label>

          <div class="password-hint">Use at least 8 characters.</div>
          <button class="primary-auth-btn" type="submit">Finish setup</button>
          <p id="firstLoginMessage" class="form-message" aria-live="polite"></p>
        </form>

        <form id="resetForm" class="login-form hidden">
          <label>
            New password
            <div class="password-wrap">
              <input id="resetPassword" type="password" autocomplete="new-password" placeholder="New password" required>
              <button class="icon-btn password-toggle" type="button" data-target="resetPassword" aria-label="Show password" title="Show password"></button>
              <button class="icon-btn copy-password" type="button" data-target="resetPassword" aria-label="Copy password" title="Copy password"></button>
            </div>
          </label>

          <label>
            Confirm new password
            <div class="password-wrap">
              <input id="resetConfirmPassword" type="password" autocomplete="new-password" placeholder="Confirm new password" required>
              <button class="icon-btn password-toggle" type="button" data-target="resetConfirmPassword" aria-label="Show password" title="Show password"></button>
              <button class="icon-btn copy-password" type="button" data-target="resetConfirmPassword" aria-label="Copy password" title="Copy password"></button>
            </div>
          </label>

          <div class="password-hint">Use at least 8 characters.</div>
          <button class="primary-auth-btn" type="submit">Change password</button>
          <p id="resetMessage" class="form-message" aria-live="polite"></p>
        </form>

        <p class="small-note">Secure company email access.</p>
      </div>
    </section>
  </main>

  <script type="module" src="app.js?v=auth-3"></script>
</body>
</html>
