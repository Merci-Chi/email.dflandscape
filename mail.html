<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#0f2617">
  <title>Desert Forest Landscape Mailbox</title>
  <link rel="stylesheet" href="styles.css?v=fixed-side-nav-1">
</head>
<body class="mail-page">
  <header class="topbar">
    <div class="topbar-left">
      <img class="topbar-main-logo" src="https://raw.githubusercontent.com/Merci-Chi/DFLandscape/main/images/logo.png" alt="Desert Forest Landscape logo">
      <a class="topbar-brand" href="https://dflandscape.com" aria-label="Desert Forest Landscape home">
        <div class="topbar-brand-images">
          <img class="topbar-brand-text" src="https://raw.githubusercontent.com/Merci-Chi/DFLandscape/main/images/text.png" alt="Desert Forest Landscape">
          <div class="topbar-slogan-row">
            <img class="topbar-brand-slogan" src="https://raw.githubusercontent.com/Merci-Chi/DFLandscape/main/images/slogan.png" alt="Turning Over a New Leaf">
            <img class="topbar-brand-leaf" src="https://raw.githubusercontent.com/Merci-Chi/DFLandscape/main/images/leaf.png" alt="">
          </div>
        </div>
        <span class="topbar-email-label">Email</span>
      </a>
    </div>
    <div class="topbar-actions">
      <a class="signout" href="index.html">Sign out</a>
    </div>
  </header>
  <main class="mail-shell">
    <aside class="sidebar">
      <button class="compose" id="composeBtn">
        <span class="btn-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 5v14"></path>
            <path d="M5 12h14"></path>
          </svg>
        </span>
        <span>Compose</span>
      </button>

      <div class="mailbox-title">Mailboxes</div>
      <nav id="accountList" class="account-list" aria-label="Email accounts"></nav>

      <div class="folder-list">
        <button class="folder active" data-folder="Inbox">
          <span class="folder-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 13h4l2 3h4l2-3h4"></path>
              <path d="M4 13V7a2 2 0 0 1 2-2h3l2 2h7a2 2 0 0 1 2 2v4"></path>
              <path d="M5 13h14v4a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2z"></path>
            </svg>
          </span>
          <span class="folder-text">Inbox</span>
        </button>
        <button class="folder" data-folder="Sent">
          <span class="folder-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 2 11 13"></path>
              <path d="M22 2 15 22l-4-9-9-4Z"></path>
            </svg>
          </span>
          <span class="folder-text">Sent</span>
        </button>
        <button class="folder" data-folder="Drafts">
          <span class="folder-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 20h9"></path>
              <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"></path>
            </svg>
          </span>
          <span class="folder-text">Drafts</span>
        </button>
        <button class="folder" data-folder="Trash">
          <span class="folder-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 6h18"></path>
              <path d="M8 6V4h8v2"></path>
              <path d="M19 6l-1 14H6L5 6"></path>
              <path d="M10 11v6"></path>
              <path d="M14 11v6"></path>
            </svg>
          </span>
          <span class="folder-text">Trash</span>
        </button>
      </div>

      <nav class="utility-nav" aria-label="Account navigation">
        <a class="utility-link" id="manageEmailsLink" href="manage-emails.html">
          <span class="utility-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="5" width="18" height="14" rx="2"></rect>
              <path d="m4 7 8 6 8-6"></path>
              <path d="M17 15h4"></path>
              <path d="M19 13v4"></path>
            </svg>
          </span>
          <span>Manage Emails</span>
        </a>
        <a class="utility-link" href="settings.html">
          <span class="utility-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21h-4v-.1A1.7 1.7 0 0 0 8 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 3.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H2v-4h.1A1.7 1.7 0 0 0 3.6 8a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 8 3.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V2h4v.1A1.7 1.7 0 0 0 15 3.6a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 8a1.7 1.7 0 0 0 .6 1 1.7 1.7 0 0 0 1.1.4H21v4h-.1a1.7 1.7 0 0 0-1.5 1.6Z"></path>
            </svg>
          </span>
          <span>Settings</span>
        </a>
      </nav>
    </aside>

    <section class="inbox-panel">
      <div class="inbox-head">
        <div>
          <div class="eyebrow dark">Mailbox</div>
          <h1 id="mailboxHeading">Inbox</h1>
          <p id="mailboxAddress"></p>
        </div>
        <div class="inbox-actions">
          <input id="searchInput" type="search" placeholder="Search mail">
          <button id="refreshBtn" title="Refresh" aria-label="Refresh">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12a9 9 0 1 1-2.64-6.36"></path>
              <path d="M21 3v6h-6"></path>
            </svg>
          </button>
        </div>
      </div>
      <div id="messageList" class="message-list"></div>
    </section>

    <section class="reader-panel" id="readerPanel">
      <div class="empty-reader">
        <div class="mail-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="5" width="18" height="14" rx="2"></rect>
            <path d="m4 7 8 6 8-6"></path>
          </svg>
        </div>
        <strong>Select an email</strong>
        <span>Choose a message to read it here.</span>
      </div>
    </section>
  </main>

  <div class="modal-backdrop hidden" id="composeModal">
    <form class="compose-modal" id="composeForm">
      <div class="compose-head">
        <strong>New message</strong>
        <button type="button" id="closeCompose" aria-label="Close">×</button>
      </div>
      <label>From<select id="composeFrom"></select></label>
      <label>To<input type="email" id="composeTo" required></label>
      <label>Subject<input type="text" id="composeSubject"></label>
      <textarea id="composeBody" placeholder="Write your message..."></textarea>
      <div class="compose-actions">
        <span id="composeStatus"></span>
        <button type="submit">Send</button>
      </div>
    </form>
  </div>

  <script type="module" src="mail.js?v=account-pages-1"></script>
</body>
</html>
